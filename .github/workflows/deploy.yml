name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/menyayka

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./... -count=1

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & check
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for API
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          docker compose -f docker-compose.e2e.yml logs
          exit 1

      - name: E2E tests
        working-directory: backend
        env:
          BASE_URL: http://localhost:8080
        run: go test -tags=e2e ./tests/e2e/ -count=1 -v

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  build-and-push:
    needs: [test, frontend-check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Ensure deploy directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p "${{ env.DEPLOY_PATH }}/backend"

      - name: Copy compose, Caddyfile, migrations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,backend/migrations"
          target: ${{ env.DEPLOY_PATH }}/
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH,GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env is missing. Copy .env.deploy.example to .env and fill secrets."
              exit 1
            fi

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export DOCKER_IMAGE_PREFIX="$IMAGE_PREFIX"
            export IMAGE_TAG="$IMAGE_TAG"

            # Зафиксировать тег выкладки в .env, чтобы ручной compose up
            # не откатывался на IMAGE_TAG=latest из старого файла.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            if grep -q '^DOCKER_IMAGE_PREFIX=' .env; then
              sed -i "s|^DOCKER_IMAGE_PREFIX=.*|DOCKER_IMAGE_PREFIX=${IMAGE_PREFIX}|" .env
            else
              echo "DOCKER_IMAGE_PREFIX=${IMAGE_PREFIX}" >> .env
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d db
            sleep 8
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml up -d --force-recreate caddy

            # Проверка, что наружу отвечает backend, а не HTML фронта
            curl -fsS --max-time 15 https://menyayka.tech/healthz | grep -q '"status"'

            docker image prune -f
