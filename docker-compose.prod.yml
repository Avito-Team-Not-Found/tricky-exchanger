services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: menyayka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: menyayka-migrate
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: menyayka-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/home/shared
    command: minio server /home/shared --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-items}
    restart: on-failure
    networks:
      - app-network

  tei:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    container_name: menyayka-tei
    command: ["--model-id", "intfloat/multilingual-e5-small", "--huggingface-hub-cache", "/data"]
    volumes:
      - teidata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - app-network

  backend:
    image: ${DOCKER_IMAGE_PREFIX}/backend:${IMAGE_TAG}
    container_name: menyayka-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      TEI_URL: http://tei:80
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-tei}
      VECTOR_DIM: ${VECTOR_DIM:-384}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-5s}
      MAX_INPUT_LENGTH: ${MAX_INPUT_LENGTH:-1500}
      MATCHING_TOPK: ${MATCHING_TOPK:-20}
      MATCHING_THRESHOLD: ${MATCHING_THRESHOLD:-0.5}
      CLUSTER_TOPK: ${CLUSTER_TOPK:-50}
      CLUSTER_SIMILARITY_THRESHOLD: ${CLUSTER_SIMILARITY_THRESHOLD:-0.9}
      VECTOR_METRIC: ${VECTOR_METRIC:-cosine}
      CLUSTER_DIRECTION_MARGIN: ${CLUSTER_DIRECTION_MARGIN:-0.05}
      CYCLE_MIN_AVERAGE_SCORE: ${CYCLE_MIN_AVERAGE_SCORE:-0.5}
      CYCLE_MAX_SCORE_GAP: ${CYCLE_MAX_SCORE_GAP:-1}
      CYCLE_OUTGOING_K: ${CYCLE_OUTGOING_K:-20}
      CYCLE_MAX_DRAFTS: ${CYCLE_MAX_DRAFTS:-10}
      MINIO_ENDPOINT: minio:9000
      # Браузер ходит на https://menyayka.tech/s3/items/... (см. Caddyfile handle_path /s3)
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-menyayka.tech/s3}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-items}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_USE_SSL: "true"
    depends_on:
      db:
        condition: service_healthy
      tei:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app-network

  frontend:
    image: ${DOCKER_IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    container_name: menyayka-frontend
    restart: unless-stopped
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: menyayka-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  pgdata:
  teidata:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
