services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: tricky-exchanger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tricky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tricky}
      POSTGRES_DB: ${DB_NAME:-tricky_exchanger}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tricky} -d ${DB_NAME:-tricky_exchanger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: >
      -path=/migrations
      -database=postgres://${DB_USER:-tricky}:${DB_PASSWORD:-tricky}@db:5432/${DB_NAME:-tricky_exchanger}?sslmode=disable
      up
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    hostname: minio
    container_name: tricky-exchanger-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tricky_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tricky_minio_secret}
    volumes:
      - minio_data:/home/shared
    command: minio server /home/shared --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Одноразовый шаг: создаёт бакет для фото товаров, если его ещё нет.
  # Тот же приём, что и с сервисом migrate — проект должен подниматься одной командой,
  # без ручных действий в консоли MinIO.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-tricky_minio} ${MINIO_SECRET_KEY:-tricky_minio_secret} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-items}
      "
    restart: on-failure

  app:
    build: ./backend
    container_name: tricky-exchanger-app
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${DB_USER:-tricky}:${DB_PASSWORD:-tricky}@db:5432/${DB_NAME:-tricky_exchanger}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      TEI_URL: ${TEI_URL:-http://tei:80}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-stub}
      VECTOR_DIM: ${VECTOR_DIM:-384}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-2s}
      MAX_INPUT_LENGTH: ${MAX_INPUT_LENGTH:-1500}
      MATCHING_TOPK: ${MATCHING_TOPK:-20}
      MATCHING_THRESHOLD: ${MATCHING_THRESHOLD:-0.5}
      CLUSTER_TOPK: ${CLUSTER_TOPK:-50}
      CLUSTER_SIMILARITY_THRESHOLD: ${CLUSTER_SIMILARITY_THRESHOLD:-0.9}
      VECTOR_METRIC: ${VECTOR_METRIC:-cosine}
      CLUSTER_DIRECTION_MARGIN: ${CLUSTER_DIRECTION_MARGIN:-0.05}
      CYCLE_OUTGOING_K: ${CYCLE_OUTGOING_K:-20}
      CYCLE_MAX_DRAFTS: ${CYCLE_MAX_DRAFTS:-10}
      MINIO_ENDPOINT: minio:9000
      # Браузер ходит на фронт :3000; фото отдаются через nginx /s3 → minio
      MINIO_PUBLIC_ENDPOINT: localhost:${FRONTEND_PORT:-3000}/s3
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tricky_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tricky_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-items}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_USE_SSL: "false"
      RANKER_MODE: ${RANKER_MODE:-ml}
      RANKER_MODEL_PATH: ${RANKER_MODEL_PATH:-/models/ranker_v1.txt}
    depends_on:
      migrate:
        condition: service_completed_successfully
      tei:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: tricky-exchanger-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      # Локальный all-in-one: прокси /api и /s3. В проде nginx.conf остаётся static-only (Caddy спереди).
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - minio
    restart: unless-stopped

  tei:
    # На x86_64 используется официальный тег cpu-1.9. На Apple Silicon (arm64) его нет
    # (нет multi-arch манифеста и версионного arm64-тега — см. issue #900 в репозитории
    # huggingface/text-embeddings-inference), поэтому там нужно переопределить в своём
    # .env: TEI_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    container_name: tricky-exchanger-tei
    command: ["--model-id", "intfloat/multilingual-e5-small", "--huggingface-hub-cache", "/data"]
    volumes:
      - teidata:/data
    ports:
      - "${TEI_EXTERNAL_PORT:-8090}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s



volumes:
  pgdata:
  teidata:
  minio_data:
