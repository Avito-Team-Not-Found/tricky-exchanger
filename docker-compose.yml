services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: tricky-exchanger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tricky}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tricky}
      POSTGRES_DB: ${DB_NAME:-tricky_exchanger}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tricky} -d ${DB_NAME:-tricky_exchanger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    command: >
      -path=/migrations
      -database=postgres://${DB_USER:-tricky}:${DB_PASSWORD:-tricky}@db:5432/${DB_NAME:-tricky_exchanger}?sslmode=disable
      up
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  app:
    build: ./backend
    container_name: tricky-exchanger-app
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${DB_USER:-tricky}:${DB_PASSWORD:-tricky}@db:5432/${DB_NAME:-tricky_exchanger}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  pgdata:
